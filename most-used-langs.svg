<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
<defs>

      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#121223"/>
        <stop offset="100%" stop-color="#1A1B2E"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
        <feOffset in="blur" dx="0" dy="2" result="off"/>
        <feMerge>
          <feMergeNode in="off"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <clipPath id="barClip">
        <rect x="40" y="98" width="640" height="14" rx="7" ry="7"/>
      </clipPath>
    
</defs>
